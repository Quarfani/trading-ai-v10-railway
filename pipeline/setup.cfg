[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --no-header
filterwarnings = ignore::DeprecationWarning

[coverage:run]
source = src
omit = tests/*,src/ingestion/mt5_ingestor.py

[coverage:report]
show_missing = True
skip_covered = False
