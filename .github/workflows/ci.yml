
name: trading-ai-ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'

# Prevent obsolete runs from consuming Actions minutes after a newer commit lands.
concurrency:
  group: trading-ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python compile
        run: python -m compileall -q pipeline bot/mt5_bridge.py

      - name: Install Python test dependencies
        run: python -m pip install -r pipeline/requirements.txt

      - name: Python tests
        run: python -m pytest pipeline/tests -q

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/backend/package-lock.json

      - name: Install backend
        working-directory: bot/backend
        run: npm ci --no-audit --no-fund

      - name: Production dependency audit
        working-directory: bot/backend
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        working-directory: bot/backend
        run: npm run typecheck

      - name: Build
        working-directory: bot/backend
        run: npm run build

      - name: Tests
        working-directory: bot/backend
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/frontend/package-lock.json

      - name: Install frontend
        working-directory: bot/frontend
        run: npm ci --no-audit --no-fund

      - name: Production dependency audit
        working-directory: bot/frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend
        working-directory: bot/frontend
        run: npm run build
